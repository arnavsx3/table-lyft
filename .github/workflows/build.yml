name: CI Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate Cross-Browser Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build Chrome (Manifest V3)
        run: npm run build

      - name: Build Firefox
        run: npm run build:firefox

      - name: Package extension zips
        run: |
          npm run zip
          npm run zip:firefox

      - name: Upload Chrome Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wingman-chrome-mv3
          path: dist/*-chrome.zip

      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wingman-firefox
          path: dist/*-firefox.zip
